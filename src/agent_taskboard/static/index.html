<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-taskboard</title>
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>agent-taskboard</h1>
      <p class="lede">Goals, expected deliverables and latest progress.</p>
    </header>
    <p id="offline" class="banner">Connection lost. Showing the last snapshot.</p>
    <div class="controls">
      <label>Search <input id="search" type="search" placeholder="Search tasks, goals, deliverables, or groups"></label>
      <label>Pin group <select id="pin"></select></label>
      <label>State <select id="status-filter">
        <option value="">All</option>
        <option value="not_started">Not started</option>
        <option value="in_progress">In progress</option>
        <option value="done">Done</option>
      </select></label>
    </div>
    <p id="counts" class="meta"></p>
    <section>
      <h2>Open tasks</h2>
      <p id="empty" class="empty" hidden>No tasks matching the selected filters.</p>
      <div id="open-list"></div>
    </section>
    <details>
      <summary>Done</summary>
      <div id="done-list"></div>
    </details>
  </div>
  <script src="/static/board.js"></script>
</body>
</html>
