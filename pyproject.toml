[project]
name = "agent-taskboard"
version = "0.2.0"
description = "Local read-only task board. An AI writes rows over HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "grapeot"}]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_taskboard = ["py.typed", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not browser'"
markers = [
    "integration: isolated localhost server",
    "browser: playwright screenshot",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
